apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ai-deploy-ingress
  namespace: ai-deploy
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: auth-service
                port:
                  number: 80
          - path: /models
            pathType: Prefix
            backend:
              service:
                name: model-service
                port:
                  number: 80
          - path: /inference
            pathType: Prefix
            backend:
              service:
                name: inference-service
                port:
                  number: 80
